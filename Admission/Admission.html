<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admission Form with Photo Preview & Captcha</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
/* 🏛️ Shiksha Portal 3.0 Color Palette */
body {
  font-family: 'Poppins', Arial, sans-serif;
  background: #f0f4f8; /* शिक्षा पोर्टल लाइट बैकग्राउंड */
  margin:0;
  padding:20px;
  color: #333;
}

.form-container {
  max-width:950px;
  margin:20px auto;
  background:#fff;
  border-radius:8px; /* प्रोफेशनल और क्लीन कॉर्पोरेट लुक */
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  padding:35px;
  border-top: 6px solid #003366; /* शिक्षा पोर्टल डार्क ब्लू ब्रांड बॉर्डर */
}

/* 🎯 हेडिंग को शिक्षा पोर्टल थीम में री-डिजाइन किया गया (बिना टेक्स्ट हटाए) */
h2 {
  text-align: center;
  font-family: 'Luckiest Guy', cursive;
  font-size: 38px;
  color: #003366; /* पोर्टल थीम नेवी ब्लू */
  background: linear-gradient(45deg, #002366, #0056b3, #0088cc); 
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  padding-bottom: 15px;
  letter-spacing: 1px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
  margin: 0 auto 25px auto;
  border-bottom: 3px solid #ff9933; /* नेशनल/स्टेट पोर्टल केसरी रंग का अंडरलाइन */
  display: block;
}

/* 🏛️ गवर्नमेंट सेक्शन सब-हेडिंग्स */
h3 {
  background: #003366; /* डार्क ब्लू यूटिलिटी बार */
  color: #fff;
  padding: 12px 15px;
  border-radius: 4px;
  margin-top: 30px;
  margin-bottom: 15px;
  font-weight: 600;
  font-size: 16px;
  letter-spacing: 0.5px;
  border-left: 5px solid #ff9933; /* अट्रैक्टिव ब्रांड एक्सेंट */
}

label {
  font-weight: 500;
  margin-top: 12px;
  display: block;
  color: #444;
  font-size: 14px;
}

/* 💼 सरकारी फॉर्म्स जैसे क्लीन और रेस्पॉन्सिव इनपुट बॉक्स */
input, select, textarea {
  width: 100%;
  padding: 10px 12px;
  margin-top: 6px;
  border-radius: 4px;
  border: 1px solid #b3c6ff; /* सॉफ्ट ब्लूश-ग्रे बॉर्डर */
  font-family: 'Poppins', Arial, sans-serif;
  box-sizing: border-box;
  background-color: #fbfcfe;
  transition: all 0.3s ease;
}

input:focus, select:focus, textarea:focus {
  border-color: #0056b3;
  box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.15);
  background-color: #fff;
  outline: none;
}

textarea {
  resize: vertical; 
  min-height: 70px;
}

/* 🛠️ ग्रिड लेआउट */
.row {
  display: flex; 
  flex-wrap: wrap;
  margin-bottom: 5px;
  margin-left: -10px;
  margin-right: -10px;
}

.row > div {
  flex: 1; 
  min-width: 220px; 
  box-sizing: border-box;
  padding-right: 10px; 
  padding-left: 10px;  
}

/* Photo Preview */
.photo-preview {
  margin-top: 12px;
  width: 140px;
  height: 140px;
  border: 2px dashed #003366;
  border-radius: 6px;
  object-fit: cover;
  display: block;
  background: #f8fafc;
}

.error {
  border: 2px solid #d9534f !important;
  background-color: #fdf2f2 !important;
}
  
.declaration-box {
  background: #f4f7fa;
  padding: 15px;
  border-radius: 6px;
  border-left: 4px solid #0056b3;
  margin-top: 15px;
}

.declaration-label {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  cursor: pointer;
}

.declaration-label input[type="checkbox"] {
  width: auto;
  margin-top: 4px;
  height: 16px;
  width: 16px;
}

.declaration-text {
  font-size: 13px;
  color: #555;
  line-height: 1.6;
}

/* 🧩 कैप्चा ब्लॉक रो */
.captcha-box {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 6px;
  margin-bottom: 12px;
}

.captcha-code {
  background: #e2e8f0;
  padding: 10px 20px;
  font-weight: 700;
  border-radius: 4px;
  letter-spacing: 4px;
  font-size: 18px;
  color: #2d3748;
  border: 1px dashed #a0aec0;
  user-select: none;
}

.refresh-btn {
  padding: 10px 18px;
  background: #e2e8f0;
  color: #003366;
  border: 1px solid #cbd5e0;
  border-radius: 4px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.refresh-btn:hover {
  background: #cbd5e0;
}

#captchaInput {
  margin-bottom: 25px;
}

/* 🎯 पोर्टल स्टाइल सबमिट बटन रैपर */
.center-btn-wrapper {
  display: flex !important;
  justify-content: center !important;
  align-items: center !important;
  width: 100% !important;
  margin-top: 20px !important;
  padding-bottom: 15px !important;
}

.submit-btn {
  background: linear-gradient(135deg, #003366 0%, #0056b3 100%) !important;
  color: white !important;
  font-family: 'Poppins', Arial, sans-serif !important;
  font-size: 16px !important;
  font-weight: 600 !important;
  padding: 12px 45px !important;
  border: none !important;
  border-radius: 4px !important;
  cursor: pointer !important;
  box-shadow: 0 4px 10px rgba(0, 51, 102, 0.2) !important;
  transition: all 0.3s ease !important;
  width: auto !important; 
  display: inline-block !important;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.submit-btn:hover {
  background: linear-gradient(135deg, #002244 0%, #004499 100%) !important;
  transform: translateY(-1px) !important;
  box-shadow: 0 6px 15px rgba(0, 51, 102, 0.3) !important;
}
</style>
</head>

<script>
  const scriptURL = "https://script.google.com/macros/s/AKfycby3CDn1RnFNmns-aIU4HT14w5QmBnKSfU6Ymp26kBwnc7K0ysoKvsDYU1bw1Mx3VDkn/exec";

  window.onload = function() {
    generateCaptcha();
  };

  function generateCaptcha() {
    let chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let captcha = "";
    for (let i = 0; i < 6; i++) {
      captcha += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    document.getElementById("captchaCode").innerText = captcha;
    window.currentCaptcha = captcha;
  }

  // 🛠️ फिक्स: खुली छूटी हुई "if-condition" को फंक्शन के अंदर सही लॉजिक के साथ सुरक्षित कर दिया है।
  function toggleSubjects() {
    let cls = document.getElementById("classSelect").value;
    let subjectBox = document.getElementById("subjectSection");
    let enrollInput = document.getElementById("enrollmentNo");

    if (cls === "XI" || cls === "XII") {
      subjectBox.style.display = "block";
    } else {
      subjectBox.style.display = "none";
    }
    
    // एनरोलमेंट नंबर के लिए शर्त (केवल 9वीं, 10वीं, 11वीं, 12वीं के लिए अनिवार्य)
    if (cls === "X" || cls === "XI" || cls === "XII") {
      if (enrollInput) enrollInput.setAttribute("required", "required");
    } else {
      if (enrollInput) {
        enrollInput.removeAttribute("required");
        enrollInput.classList.remove("error");
      }
    }
  }

  document.getElementById('photoUpload').addEventListener('change', function() {
    const file = this.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('photoPreview').src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  });

  function sendToServer(obj) {
    fetch(scriptURL, {
      method: "POST",
      body: JSON.stringify(obj),
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      }
    })
    .then(res => res.text())
    .then(data => {
      let students = JSON.parse(localStorage.getItem("students")) || [];
      students.push({
        appno: data, 
        mobile1: obj.mobile1,
        name: obj.studentName,
        father: obj.fatherName,
        mother: obj.motherName,
        dob: obj.dob,
        class: obj.class,
        medium: obj.medium,
        gender: obj.gender,
        category: obj.category,
      });

      localStorage.setItem("students", JSON.stringify(students));

      alert("📄 छात्र का आवेदन क्रमांक: " + data +
        "\n\n✅ आपका आवेदन पत्र सफलतापूर्वक जमा हो चुका है।" +
        "\nकृपया भविष्य के लिए इस क्रमांक को सुरक्षित रखें।");

      let mobileValue = obj.mobile1;
      window.location.href = "ReceiptSearch.html?appNo=" + data + "&mobile1=" + mobileValue;
    })
    .catch(err => {
      alert("Error: " + err);
    });
  }
    
  document.getElementById('admissionForm').addEventListener('submit', function(e) {
    e.preventDefault();

    let userCaptcha = document.getElementById('captchaInput').value;
    let actualCaptcha = document.getElementById('captchaCode').textContent;

    if (userCaptcha.trim().toLowerCase() !== actualCaptcha.trim().toLowerCase()) {
      alert("❌ कैप्चा गलत है, कृपया पुनः प्रयास करें");
      generateCaptcha();
      return;
    }

    let form = document.getElementById("admissionForm");
    let formData = new FormData(form);
    let file = document.getElementById("photoUpload").files[0];

    if (file) {
      let reader = new FileReader();
      reader.onload = function() {
        formData.set("photo", reader.result);
        let obj = {};
        formData.forEach((v, k) => {
          obj[k] = v; 
        });
        sendToServer(obj);
      };
      reader.readAsDataURL(file);
    } else {
      let obj = {};
      formData.forEach((v, k) => obj[k] = v);
      sendToServer(obj);
    }
  });
</script>
  
<script>
function stateChange() {
  let s = document.getElementById("state").value;
  let d = document.getElementById("district");

  d.innerHTML = '<option value="">Select District</option>';

  if (s === "Madhya Pradesh") {
    d.innerHTML += `
      <option>Bhopal</option>
      <option>Sehore</option>
      <option>Rajgarh</option>
      <option>Guna</option>
    `;
  }
}

function districtChange() {
  let d = document.getElementById("district").value;
  let t = document.getElementById("tehsil");

  t.innerHTML = '<option value="">Select Tehsil</option>';

  if (d === "Bhopal") {
    t.innerHTML += `<option>Huzur</option><option>Berasia</option>`;
  }
  if (d === "Sehore") {
    t.innerHTML += `<option>Sehore</option><option>Ashta</option><option>Ichhawar</option>`;
  }
  if (d === "Rajgarh") {
    t.innerHTML += `<option>Rajgarh</option><option>Biaora</option><option>Narsinghgarh</option>`;
  }
  if (d === "Guna") {
    t.innerHTML += `<option>Guna</option><option>Raghogarh</option><option>Aron</option>`;
  }
}
</script>
  
<script>
function validateForm() {
  let isValid = true;
  let inputs = document.querySelectorAll("#admissionForm input, #admissionForm select, #admissionForm textarea");

  inputs.forEach(function(field) {
    field.classList.remove("error");
    if (field.hasAttribute("required") && field.value.trim() === "") {
      field.classList.add("error"); 
      isValid = false;
    }
  });

  if (!isValid) {
    alert("⚠️ कृपया सभी जरूरी जानकारी भरें");
  }

  return isValid;
}
</script>
